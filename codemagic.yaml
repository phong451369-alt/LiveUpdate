workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Unzip and Build
        script: |
          # Giải nén file zip
          unzip -o "*.zip"
          
          # Tự động tìm và chui vào thư mục chứa source code vừa giải nén
          cd LiveUpdate-3.0.1 || cd $(find . -maxdepth 2 -type d | grep -v '^\.$' | head -n 1)
          
          # Tìm thư mục thực tế có chứa build.gradle
          BUILD_DIR=$(dirname $(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1))
          echo "Found build directory: $BUILD_DIR"
          cd "$BUILD_DIR"
          
          # Cấp quyền và build
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
    artifacts:
      - /**/build/outputs/apk/**/*.apk
